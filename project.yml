name: App
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: "1.0.0"
  Core:
    path: Packages/Core
targets:
  App:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tube
        CFBundleName: Tube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Tube runs a small setup page on your home network so you can paste your YouTube cookies from your phone or computer."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tube
        PRODUCT_NAME: App
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: Core
        product: Core
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
